<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>網址收藏庫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
  :root { color-scheme: light; }
  [hidden] { display: none !important; }
  body { margin: 0; }
  /* Layout: category rail on the left (chips on phones), one working column on the right: add form, search, then link rows grouped by category. */
  :root {
    --bg: #F5F6F6;
    --surface: #FFFFFF;
    --fg: #161A1A;
    --muted: #5E6868;
    --line: #DFE3E3;
    --accent: #0B7A6B;
    --accent-ink: #FFFFFF;
    --danger: #B42318;
    --tile-bg-l: 90%;
    --tile-fg-l: 26%;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1212; --surface: #151A1A; --fg: #E6EBEA; --muted: #93A09E; --line: #252C2C;
      --accent: #4FD1B5; --accent-ink: #0A1413; --danger: #FF8A7A;
      --tile-bg-l: 22%; --tile-fg-l: 80%;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1212; --surface: #151A1A; --fg: #E6EBEA; --muted: #93A09E; --line: #252C2C;
    --accent: #4FD1B5; --accent-ink: #0A1413; --danger: #FF8A7A;
    --tile-bg-l: 22%; --tile-fg-l: 80%;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap {
    max-width: 1040px; margin: 0 auto;
    padding-block: 32px 72px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 32px; }
  h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: 0.02em; line-height: 1.3; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; font-family: var(--font-mono); letter-spacing: 0.03em; }
  .ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; font-size: 0.8125rem; font-family: var(--font-mono); color: var(--muted); cursor: pointer; }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
  @media (min-width: 860px) { .layout { grid-template-columns: 210px minmax(0, 1fr); gap: 56px; } }

  /* category rail */
  .rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  @media (min-width: 860px) { .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; } }
  .rail-title { margin: 0; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 500; letter-spacing: 0.14em; color: var(--muted); }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  @media (min-width: 860px) { .cats { flex-direction: column; flex-wrap: nowrap; gap: 2px; } }
  .cat { display: flex; align-items: center; gap: 4px; }
  .cat-btn {
    flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; cursor: pointer; text-align: left;
  }
  @media (min-width: 860px) { .cat-btn { border-color: transparent; border-radius: 6px; padding: 5px 10px; } }
  .cat-btn:hover { border-color: var(--accent); }
  .cat-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .cat-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-count { font-family: var(--font-mono); font-size: 0.75rem; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .cat-del { background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 0.9rem; line-height: 1; }
  .cat-del:hover { color: var(--danger); }
  .cat-del[disabled] { opacity: 0.3; cursor: not-allowed; }
  .cat-add { display: flex; gap: 6px; }
  .cat-add input { flex: 1; min-width: 0; }

  /* inputs */
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label, .field .lbl { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; color: var(--muted); }
  input[type="text"], input[type="url"], input[type="search"], select {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-height: 40px;
  }
  input::placeholder { color: var(--muted); opacity: 0.8; }
  input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
  .btn { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 6px; padding: 8px 18px; min-height: 40px; font-weight: 500; cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: 0.55; cursor: progress; }
  .btn.alt { background: transparent; color: var(--fg); border-color: var(--line); }
  .btn.alt:hover { border-color: var(--accent); color: var(--accent); filter: none; }
  .btn.small { min-height: 40px; padding: 8px 12px; }

  /* multi-category picker in the form, and category chips on each row */
  .pick-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .pick-head #pickCount { color: var(--accent); }
  .pick-q { max-width: 280px; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; max-height: 176px; overflow-y: auto; padding: 2px; }
  .pick { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; min-height: 36px; cursor: pointer; }
  .pick:hover { border-color: var(--accent); }
  .pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .picks-empty { color: var(--muted); font-size: 0.9rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.03em; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border: 0; border-radius: 4px; padding: 1px 10px; cursor: pointer; }
  .chip:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }

  /* add form */
  .main { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  form.add { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
  form.add .f-url { grid-column: 1 / -1; }
  form.add .f-cat { grid-column: 1 / -1; }
  form.add .f-title { grid-column: span 2; }
  form.add .f-note { grid-column: span 4; }
  form.add .f-vis { grid-column: span 3; }
  form.add .f-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
  form.add .mode { margin-right: auto; font-family: var(--font-mono); font-size: 0.8125rem; color: var(--accent); }
  @media (max-width: 620px) {
    form.add .f-url, form.add .f-cat, form.add .f-title, form.add .f-note, form.add .f-vis { grid-column: 1 / -1; }
  }
  .readonly-note { margin: 0; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 0.9rem; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .toolbar input { flex: 1 1 220px; }

  /* list */
  .group { display: flex; flex-direction: column; }
  .group + .group { margin-top: 28px; }
  .group h2 { margin: 0 0 8px; display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-weight: 500; font-size: 0.8125rem; letter-spacing: 0.12em; color: var(--muted); }
  .group h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .item { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; padding-block: 14px; border-top: 1px solid var(--line); }
  .group .item:first-of-type { border-top: 0; }
  .tile {
    width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 1rem; margin-top: 2px;
    background: hsl(var(--h) 38% var(--tile-bg-l)); color: hsl(var(--h) 55% var(--tile-fg-l));
  }
  .info { min-width: 0; }
  .info a.title { font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
  .info a.title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .url { margin: 0; font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); overflow-wrap: anywhere; }
  .note { margin: 4px 0 0; font-size: 0.9rem; color: var(--muted); overflow-wrap: anywhere; }
  .date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .acts { display: flex; gap: 4px; }
  .act { background: transparent; border: 0; padding: 8px 10px; min-height: 40px; border-radius: 6px; font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); cursor: pointer; }
  .act:hover { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .act.del:hover, .act.del.armed { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  @media (max-width: 620px) {
    .item { grid-template-columns: 36px minmax(0, 1fr); }
    .acts { grid-column: 2; margin-left: -10px; }
  }

  .empty { border: 1px dashed var(--line); border-radius: 10px; padding: 36px 20px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--fg); font-weight: 500; font-size: 1.0625rem; margin-bottom: 4px; }

  /* spaces: the top level above the link page */
  .crumb { background: transparent; border: 0; padding: 4px 0; min-height: 32px; font-family: var(--font-mono); font-size: 0.8125rem; letter-spacing: 0.04em; color: var(--muted); cursor: pointer; }
  .crumb:hover { color: var(--accent); }
  header > div { min-width: 0; }
  h1 { overflow-wrap: anywhere; }
  .space-add { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-bottom: 28px; max-width: 520px; }
  .space-add .field { flex: 1 1 220px; }
  .spaces { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .space { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-width: 0; }
  .space:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .space-open { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; background: transparent; border: 0; padding: 18px 18px 12px; cursor: pointer; border-radius: 10px 10px 0 0; min-width: 0; width: 100%; }
  .space-open .tile { margin-bottom: 8px; }
  .space-name { font-size: 1.1875rem; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
  .space-meta { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .space-acts { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 10px; }
  .space-rename { display: flex; flex-direction: column; gap: 8px; padding: 18px; }
  .space-rename .row-btns { display: flex; gap: 8px; }
  .home-search { margin-bottom: 20px; max-width: 520px; }
  .res-meta { margin: 16px 0 0; color: var(--muted); font-size: 0.875rem; }
  #results .group .spaces { margin-top: 4px; }
  .chip.static { cursor: default; }

  /* one small image per link and per space, in the same box the letter tile uses */
  .tile.has-img { background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  form.add .f-img { grid-column: 1 / -1; }
  #sImageField { flex: 0 0 auto; }
  .imgpick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .imgpick-prev { width: 48px; height: 48px; border-radius: 8px; border: 1px dashed var(--line); display: grid; place-items: center; overflow: hidden; color: var(--muted); background: var(--surface); flex: none; font-size: 0.75rem; }
  .imgpick-prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .imgpick-note { font-size: 0.8125rem; color: var(--muted); font-family: var(--font-mono); overflow-wrap: anywhere; min-width: 0; }
  .usage { margin: 40px 0 0; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.03em; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    max-width: calc(100vw - 32px); background: var(--fg); color: var(--bg);
    padding: 8px 16px; border-radius: 8px; font-size: 0.9rem; z-index: 10;
  }
  .toast[hidden] { display: none; }

  @media (prefers-reduced-motion: no-preference) {
    button, a, input, select { transition: color .15s, background-color .15s, border-color .15s, box-shadow .15s; }
  }

  /* standalone-only: sign-in gate and account area */
  .hdr-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .who { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--muted); overflow-wrap: anywhere; }
  .gate { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px 22px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; max-width: 560px; }
  .gate-title { margin: 0; font-size: 1.25rem; font-weight: 500; line-height: 1.4; }
  .gate-text { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  body.gated #homeView, body.gated #spaceView, body.gated #backBtn { display: none !important; }

  /* ---------- sharing ---------- */
  .act.on { color: var(--accent); }
  .shares { margin-top: 28px; }
  .shares-title { margin: 0 0 8px; display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-weight: 500; font-size: 0.8125rem; letter-spacing: 0.12em; color: var(--muted); }
  .shares-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .shares-note { margin: 0 0 8px; color: var(--danger); font-size: 0.9rem; }
  .share-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding-block: 10px; border-top: 1px solid var(--line); }
  .share-badge { font-family: var(--font-mono); font-size: 0.75rem; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .share-info { display: flex; flex-direction: column; min-width: 0; }
  .share-name { overflow-wrap: anywhere; font-weight: 500; }
  .share-sub { color: var(--muted); font-size: 0.8125rem; }
  .share-sync { font-size: 0.8125rem; font-weight: 500; }
  .share-sync.sync-success { color: var(--accent); }
  .share-sync.sync-error, .share-sync-error { color: var(--danger); }
  .share-sync.sync-pending, .share-sync.sync-syncing, .share-sync.sync-retrying { color: var(--muted); }
  .share-sync-time { font-size: 0.75rem; color: var(--muted); }
  .share-sync-error { font-size: 0.75rem; overflow-wrap: anywhere; }
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-card { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(520px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  .modal-title { margin: 0; font-size: 1.125rem; font-weight: 500; overflow-wrap: anywhere; }
  .modal-note { margin: 0; color: var(--muted); font-size: 0.875rem; }
  .modal-err { margin: 0; color: var(--danger); font-size: 0.875rem; }
  .share-modes { display: flex; flex-direction: column; gap: 8px; }
  .share-mode { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .share-mode input { margin-top: 5px; }
  .share-emails { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 8px 10px; font: inherit; color: inherit; resize: vertical; }
  .share-linkrow { display: flex; gap: 8px; }
  .share-linkrow input { flex: 1; min-width: 0; }
  .acct { display: flex; flex-direction: column; gap: 8px; }
  .acct-box { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 6px 8px; cursor: text; }
  .acct-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
  .acct-chips { display: contents; }
  .acct-chip { display: inline-flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid transparent; border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 0.875rem; overflow-wrap: anywhere; }
  .acct-chip.unseen { background: transparent; border: 1px dashed var(--muted); }
  .acct-x { border: 0; background: transparent; cursor: pointer; color: var(--muted); min-width: 28px; min-height: 28px; border-radius: 50%; font-size: 1.1rem; line-height: 1; }
  .acct-x:hover { color: var(--danger); }
  .acct-box input.acct-input { flex: 1; min-width: 150px; width: auto; border: 0; box-shadow: none; background: transparent; outline: none; padding: 6px 2px; }
  .acct-field { position: relative; }
  .acct-suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; box-shadow: 0 6px 20px rgba(0,0,0,.18); list-style: none; margin: 0; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-height: 180px; overflow: auto; }
  .acct-suggest li { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; overflow-wrap: anywhere; }
  .acct-suggest li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .acct-suggest .acct-none { color: var(--muted); cursor: default; }
  .acct-sub { font-size: 0.8125rem; color: var(--muted); }
  .modal-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .share-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
  .share-title { margin: 0; font-size: 1.25rem; font-weight: 500; overflow-wrap: anywhere; }
  .share-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.875rem; }
  body.viewing #homeView, body.viewing #spaceView, body.viewing #backBtn, body.viewing #gate { display: none !important; }
  @media (max-width: 520px) { .share-row { grid-template-columns: auto minmax(0, 1fr); } .share-row .acts { grid-column: 1 / -1; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <button class="crumb" id="backBtn" type="button" hidden>← 所有分區</button>
      <h1 id="pageTitle">網址收藏庫</h1>
      <p class="sub" id="summary">載入中…</p>
    </div>
    <div class="hdr-actions">
      <span class="who" id="who" hidden></span>
      <button class="ghost" id="signOutBtn" type="button" hidden>登出</button>
      <button class="ghost" id="themeBtn" type="button" aria-label="切換深色或淺色模式">切換主題</button>
    </div>
  </header>

  <section class="gate" id="gate" hidden>
    <h2 class="gate-title" id="gateTitle"></h2>
    <p class="gate-text" id="gateText"></p>
    <button class="btn" id="signInBtn" type="button" hidden>用 Google 帳號登入</button>
  </section>

  <section id="shareView" hidden>
    <div class="share-head" id="shareHead" hidden>
      <div id="shareTileSlot"></div>
      <div><h2 class="share-title" id="shareTitle"></h2><p class="share-meta" id="shareMeta"></p></div>
    </div>
    <div class="gate" id="shareMsg" hidden>
      <p class="gate-text" id="shareMsgText"></p>
      <button class="btn" id="shareSignIn" type="button" hidden>用 Google 帳號登入</button>
    </div>
    <div class="home-search" id="shareSearch" hidden>
      <input type="search" id="shareQ" placeholder="搜尋這個分享裡的連結" aria-label="搜尋分享內容" autocomplete="off">
    </div>
    <div id="shareItems"></div>
  </section>

  <section id="homeView">
    <div class="home-search" id="homeSearch" hidden>
      <input type="search" id="homeQ" placeholder="搜尋所有分區的連結、分類或分區名稱" aria-label="搜尋全部分區" autocomplete="off">
    </div>
    <form class="space-add" id="spaceForm" autocomplete="off" hidden>
      <div class="field">
        <label for="spaceInput">新增分區</label>
        <input type="text" id="spaceInput" maxlength="20" placeholder="例如：工作、學習、生活">
      </div>
      <div class="field" id="sImageField" hidden>
        <span class="lbl">圖片（選填）</span>

  /* ---------- spaces (top level) ---------- */

  function renderSpaceCard(s) {

  /* search across every space: space names, plus each space's links by title, url, note and categories */
  var MAX_RESULTS = 100;
  function linkMatches(l, q) {
    return [l.title, l.url, l.note, linkCats(l).join(' ')].some(function (x) { return (x || '').toLowerCase().indexOf(q) !== -1; });
  }
  function renderResults(raw) {
    var q = raw.toLowerCase();
    var box = $('results'); box.textContent = '';
    var shown = 0, total = 0, loaded = 0;

    var nameHits = state.spaces.filter(function (s) { return s.name.toLowerCase().indexOf(q) !== -1; });
    if (nameHits.length) {
      var g0 = el('section', 'group');
      g0.appendChild(el('h2', null, '分區　' + nameHits.length));
      var grid = el('div', 'spaces');
      nameHits.forEach(function (s) { grid.appendChild(renderSpaceCard(s)); });
      g0.appendChild(grid); box.appendChild(g0);
    }
    state.spaces.forEach(function (s) {
      var all = state.spaceLinks[s.id];
      if (!all) return;
      loaded++;
      var hits = all.filter(function (l) { return !l.hideFromHome && linkMatches(l, q); })
        .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      if (!hits.length) return;
      total += hits.length;
      var room = MAX_RESULTS - shown;
      if (room <= 0) return;
      var g = el('section', 'group');
      g.appendChild(el('h2', null, s.name + '　' + hits.length));
      hits.slice(0, room).forEach(function (l) { g.appendChild(renderResultItem(l, s, raw)); shown++; });
      box.appendChild(g);
    });

    var stillLoading = loaded < state.spaces.length;
    if (!nameHits.length && total === 0) {
      box.appendChild(el('div', 'empty', stillLoading ? '搜尋中…' : '找不到符合「' + raw + '」的分區或連結。'));
      return;
    }
    if (total > shown) box.appendChild(el('p', 'res-meta', '共 ' + total + ' 筆符合，只顯示前 ' + MAX_RESULTS + ' 筆，請輸入更多文字縮小範圍。'));
    if (stillLoading) box.appendChild(el('p', 'res-meta', '還在載入部分分區的內容，結果可能不完整…'));
  }
  function renderResultItem(l, s, raw) {
    var row = el('article', 'item');
    var hostName = host(l.url || '');
    var tile = tileEl(l.image, hostName.charAt(0), hostName);
    row.appendChild(tile);
    var info = el('div', 'info');
    var href = safeHref(l.url);
    var title = l.title || hostName;
    if (href) {
      var a = el('a', 'title', title); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      info.appendChild(a);
    } else { info.appendChild(el('span', 'title', title)); }
    info.appendChild(el('p', 'url', hostName));
    if (l.note) info.appendChild(el('p', 'note', l.note));
    var cs = linkCats(l);
    if (cs.length) {

      info.appendChild(chips);
    }
    row.appendChild(info);
    var acts = el('div', 'acts');
    var copy = el('button', 'act', '複製'); copy.type = 'button';

  var spaceArmTimer = null;
  function onDeleteSpace(s) {
    if (state.armedSpace !== s.id) {
      state.armedSpace = s.id; renderHome();
      clearTimeout(spaceArmTimer); spaceArmTimer = setTimeout(function () { state.armedSpace = null; renderHome(); }, 4000);
      return;

    clearTimeout(spaceArmTimer); state.armedSpace = null;
    deleteSpace(s);
  }
  /* a space's links and category list are separate documents, so remove them first, then the space itself */
  async function deleteSpace(s) {
    state.deletingSpace = s.id; renderHome();
    try {
      var snap = await db.collection('spaces/' + s.id + '/links').limit(1000).get();
      var imgs = [];
      for (var i = 0; i < snap.docs.length; i++) {
        var dd = snap.docs[i].data();
        await db.doc('spaces/' + s.id + '/links/' + snap.docs[i].id).delete();
        if (dd && dd.image) imgs.push(dd.image);
      }
      await db.doc('spaces/' + s.id + '/meta/categories').delete();
      await db.doc('spaces/' + s.id).delete();
      if (s.image) imgs.push(s.image);
      for (var k = 0; k < imgs.length; k++) await dropAsset(imgs[k]);
      toast('已刪除分區'); refreshUsage();
    } catch (e) { toast('刪除失敗，請稍後再試'); }
    state.deletingSpace = null; renderHome();
  }

  function closeEditPicker() { if (state.editPicker) state.editPicker.dispose(); state.editPicker = null; }
  async function renameSpace(s, raw) {
    if (state.savingSpace) return;

    if (!name) { toast('分區名稱不能是空白'); return; }
    var pk = state.editPicker;
    var nameSame = name === s.name;
    var imageChanged = !!(pk && (pk.state.file || pk.state.removed));
    if (nameSame && !imageChanged) { state.renamingSpace = null; state.renameDraft = null; closeEditPicker(); renderHome(); return; }
    if (!nameSame && state.spaces.some(function (x) { return x.name === name; })) { toast('已經有同名的分區了'); return; }
    state.savingSpace = true;
    try {
      var img;

      var data = { name: name, createdAt: s.createdAt || Date.now() };

      catch (e) { dropAsset(img.uploadedId); toast('儲存失敗，請稍後再試'); return; }
      dropAsset(img.oldToDelete);
      state.renamingSpace = null; state.renameDraft = null; closeEditPicker();
      toast('已儲存分區'); render(); refreshUsage();

  }

  $('spaceForm').addEventListener('submit', function (ev) {
    ev.preventDefault();

  /* ---------- navigation and subscriptions ---------- */
  function clearCountSubs() {
    Object.keys(subs.counts).forEach(function (id) { unsub(subs.counts[id]); });
    subs.counts = {}; state.spaceCounts = {}; state.spaceLinks = {};
  }
  /* home page only: one live count per space, reconciled when the space list changes */
  function syncCountSubs() {
    if (state.view !== 'home') return;
    var ids = state.spaces.map(function (s) { return s.id; });
    Object.keys(subs.counts).forEach(function (id) {
      if (ids.indexOf(id) === -1) { unsub(subs.counts[id]); delete subs.counts[id]; delete state.spaceCounts[id]; delete state.spaceLinks[id]; }
    });
    ids.forEach(function (id) {
      if (subs.counts[id]) return;
      subs.counts[id] = db.collection('spaces/' + id + '/links').onSnapshot(function (snap) {
        state.spaceCounts[id] = snap.size;
        state.spaceLinks[id] = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        if (state.view === 'home') renderHome();
      }, function () { /* the count is a nicety; the card still opens */ });
    });
  }
  function listenSpaces() {
    subs.spaces = db.collection('spaces').orderBy('createdAt', 'asc').limit(200).onSnapshot(function (snap) {
      state.spaces = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.spacesLoaded = true;
      if (state.view === 'space' && !spaceById(state.spaceId)) { goHome(); toast('這個分區已被刪除'); return; }
      syncCountSubs();
      render();
    }, onErr);
  }

  function resetSpaceState() {
    state.links = []; state.cats = []; state.loaded = false; state.filter = '__all'; state.q = ''; $('q').value = '';
    state.armed = null; state.pickQ = ''; $('pickQ').value = '';

  }
  function openSpace(id, presetQ) {
    if (!spaceById(id)) return;
    clearCountSubs();
    state.view = 'space'; state.spaceId = id; state.renamingSpace = null; state.armedSpace = null;
    resetSpaceState();
    if (presetQ) { state.q = presetQ; $('q').value = presetQ; } /* land in the space with the same search applied */
    subs.space.push(db.collection('spaces/' + id + '/links').orderBy('createdAt', 'desc').limit(1000).onSnapshot(function (snap) {
      if (state.spaceId !== id) return;
      state.links = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      state.loaded = true; render();
    }, onErr));
    subs.space.push(db.doc('spaces/' + id + '/meta/categories').onSnapshot(function (snap) {
      if (state.spaceId !== id) return;
      var d = snap.exists ? snap.data() : null;

  function goHome() {

  }
  $('backBtn').addEventListener('click', goHome);
  $('homeQ').addEventListener('input', function (e) { state.homeQ = e.target.value; if (state.view === 'home') renderHome(); });
  $('homeQ').addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.homeQ) { e.target.value = ''; state.homeQ = ''; renderHome(); }
  });

  /* ---------- sharing (GitHub Pages build only) ----------
     A share is a separate copy under shares/<id> (+ shares/<id>/items/*). The owner's own data under users/<uid>/
     is never opened to anyone else. While the owner has this page open, the copy is kept in sync automatically.
     Links marked 隱藏 are never copied. */

      }
      toast(ex ? '已儲存分享設定' : '已建立分享');
    } catch (e) {
      d.err = '儲存失敗。請確認已把新版 firestore.rules 貼到 Firebase 並發布。';
    }
    d.busy = false; renderShareModal();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && SH.modal) closeShareModal(); });

  function renderShareSection() {
    var sec = $('shareSection');
    sec.textContent = '';
    if (!SH.fs || SH.searching || (!SH.list.length && !SH.error)) { sec.hidden = true; return; }
    sec.hidden = false;
    sec.appendChild(el('h2', 'shares-title', '分享網址'));
    if (SH.error) sec.appendChild(el('p', 'shares-note', '分享功能還沒啟用：請把新版 firestore.rules 貼到 Firebase 的「規則」並發布。'));
    SH.list.forEach(function (s) {
      var row = el('article', 'share-row');
      row.appendChild(el('span', 'share-badge', s.kind === 'space' ? '分區' : '連結'));
      var info = el('div', 'share-info');
      info.appendChild(el('strong', 'share-name', s.name || '（未命名）'));
      info.appendChild(el('span', 'share-sub', (s.mode === 'public' ? '公開連結' : '指定 ' + (s.viewers || []).length + ' 個帳號') + '・' + (s.itemCount || 0) + ' 個連結'));
      var st = syncState(s);
      var syncLabel = { pending: '等待同步', syncing: '同步中…', retrying: '暫時失敗，準備自動重試（' + st.attempt + '/' + SYNC_RETRY_DELAYS.length + '）', success: '同步完成', error: '同步失敗' }[st.phase] || '等待檢查';
      var syncLine = el('span', 'share-sync sync-' + st.phase, syncLabel);
      syncLine.setAttribute('role', 'status');
      info.appendChild(syncLine);
      info.appendChild(el('span', 'share-sync-time', st.lastSuccess ? '最後成功：' + new Date(st.lastSuccess).toLocaleString('zh-TW') : '尚無成功同步紀錄'));
      if (st.error) info.appendChild(el('span', 'share-sync-error', st.error));
      row.appendChild(info);
      var acts = el('div', 'acts');
      var cp = el('button', 'act', '複製連結'); cp.type = 'button';
      cp.addEventListener('click', function () { copyText(shareUrl(s.id), cp); });
      var set = el('button', 'act', '設定'); set.type = 'button';
      set.addEventListener('click', function () { openShareModal({ kind: s.kind, spaceId: s.spaceId, linkId: s.linkId, name: s.name || '' }); });
      var retry = el('button', 'act', '重新同步'); retry.type = 'button';
      retry.disabled = st.phase === 'syncing';
      retry.setAttribute('aria-label', '重新同步「' + (s.name || '分享') + '」');
      retry.addEventListener('click', function () { scheduleSync(s.id, true); });
      acts.appendChild(cp); acts.appendChild(set); acts.appendChild(retry); row.appendChild(acts);
      sec.appendChild(row);
    });
  }

  var shareApi = {
    renderHome: function (searching) { SH.searching = !!searching; renderShareSection(); },
    spaceBtn: function (s) {
      if (!SH.fs) return null;
      var ex = shareFor('space', s.id);
      var b = el('button', 'act' + (ex ? ' on' : ''), ex ? '分享中' : '分享'); b.type = 'button';
      b.addEventListener('click', function () { openShareModal({ kind: 'space', spaceId: s.id, name: s.name }); });
      return b;
    },
    linkBtn: function (l) {
      if (!SH.fs) return null;
      var ex = shareFor('link', state.spaceId, l.id);
      if (!ex && l.hideFromHome) return null;
      var b = el('button', 'act' + (ex ? ' on' : ''), ex ? '分享中' : '分享'); b.type = 'button';
      b.addEventListener('click', function () { openShareModal({ kind: 'link', spaceId: state.spaceId, linkId: l.id, name: l.title || host(l.url || '') }); });
      return b;
    }
  };

  /* ----- viewer page (#share=<id>): read only ----- */
  function dataTile(data, label, seed) {
    var t = el('div', 'tile', ((label || '').charAt(0) || '?').toUpperCase());
    t.style.setProperty('--h', String(hue(seed || label || ''))); t.setAttribute('aria-hidden', 'true');
    if (typeof data === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,/.test(data)) {
      var im = el('img'); im.alt = ''; im.decoding = 'async';
      im.addEventListener('error', function () { t.classList.remove('has-img'); t.textContent = ((label || '').charAt(0) || '?').toUpperCase(); });
      im.src = data; t.textContent = ''; t.classList.add('has-img'); t.appendChild(im);
    }
    return t;
  }
  function startJoin(auth, fs, signIn) {
    document.body.classList.add('viewing');
    hideGate();
    $('shareView').hidden = false;
    $('pageTitle').textContent = '加入分享'; $('summary').textContent = '';
    function say(text, btn) { $('shareMsgText').textContent = text; $('shareMsg').hidden = false; $('shareSignIn').hidden = !btn; }
    $('shareSignIn').addEventListener('click', function () { signIn(true); });
    $('signOutBtn').addEventListener('click', function () { signOut(auth); });
    window.addEventListener('hashchange', function () { location.reload(); });
    onAuthStateChanged(auth, function (user) {
      if (!user) { $('who').hidden = true; $('signOutBtn').hidden = true; say('請用你想被加入分享的 Google 帳號登入。登入後，分享的人就能在名單裡找到你。', true); return; }
      $('who').textContent = user.email || ''; $('who').hidden = false; $('signOutBtn').hidden = false;
      say('正在登記你的帳號…', false);
      registerAccount(fs, user).then(function (ok) {
        say(ok ? '已登記帳號 ' + user.email + '。請告訴分享的人，請他把你加進分享名單。' : '登記失敗，請稍後再試，或請分享的人確認 Firestore 規則已更新。', false);
      });
    }, function () { say('目前無法連線，請稍後再試。', false); });
  }
  function startViewer(auth, fs, id, signIn) {
    document.body.classList.add('viewing');
    hideGate();
    $('shareView').hidden = false;
    $('pageTitle').textContent = '分享的收藏';
    $('summary').textContent = '唯讀';
    var V = { head: null, items: [], loaded: false, q: '', dead: false };
    var subHead = null, subItems = null;

    function message(text, withBtn, btnText) {
      if (V.dead) return;
      $('shareMsgText').textContent = text; $('shareMsg').hidden = false;
      $('shareSignIn').hidden = !withBtn; if (btnText) $('shareSignIn').textContent = btnText;
      $('shareHead').hidden = true; $('shareSearch').hidden = true; $('shareItems').textContent = '';
    }
    function paintHead() {
      var h = V.head; if (!h || V.dead) return;
      $('shareMsg').hidden = true; $('shareHead').hidden = false;
      var slot = $('shareTileSlot'); slot.textContent = ''; slot.appendChild(dataTile(h.imageData, h.name || '?', h.name));
      $('shareTitle').textContent = h.name || '分享';
      $('shareMeta').textContent = (h.mode === 'public' ? '公開連結' : '只有指定帳號可以看') + '・' + (h.itemCount || 0) + ' 個連結';
      document.title = (h.name || '分享') + '・網址收藏庫';
    }
    function paintItems() {
      if (!V.head || V.dead) return;
      var box = $('shareItems'); box.textContent = '';
      $('shareSearch').hidden = V.items.length < 2;
      var q = V.q.trim().toLowerCase();
      var rows = V.items.filter(function (it) {
        if (!q) return true;
        return [it.title, it.url, it.note, (it.categories || []).join(' ')].some(function (x) { return (x || '').toLowerCase().indexOf(q) !== -1; });
      }).sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      if (!rows.length) { box.appendChild(el('div', 'empty', !V.loaded ? '載入中…' : V.items.length ? '找不到符合的連結。' : '這個分享目前沒有可顯示的連結。')); return; }
      var grp = el('section', 'group');
      rows.forEach(function (it) {
        var row = el('article', 'item');
        var hn = host(it.url || '');
        row.appendChild(dataTile(it.imageData, hn, hn));
        var info = el('div', 'info');
        var href = safeHref(it.url), title = it.title || hn;
        if (href) { var a = el('a', 'title', title); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer'; info.appendChild(a); }
        else info.appendChild(el('span', 'title', title));
        info.appendChild(el('p', 'url', hn));
        if (it.note) info.appendChild(el('p', 'note', it.note));
        if ((it.categories || []).length) {
          var chips = el('div', 'chips');
          it.categories.forEach(function (c) { chips.appendChild(el('span', 'chip static', c)); });
          info.appendChild(chips);
        }
        row.appendChild(info);
        var acts = el('div', 'acts');
        var cp = el('button', 'act', '複製'); cp.type = 'button';
        cp.addEventListener('click', function () { copyText(it.url, cp); });
        acts.appendChild(cp); row.appendChild(acts);
        grp.appendChild(row);
      });
      box.appendChild(grp);
    }
    function denied(user) {
      if (V.dead) return;
      V.head = null; V.items = [];
      document.title = '網址收藏庫';
      if (user) message('這個帳號（' + (user.email || '') + '）沒有權限查看，或這個分享已經停止。', true, '改用其他帳號登入');
      else message('找不到這個分享，或它只開放給指定的人。如果對方請你用 Google 帳號登入，請按下面的按鈕。', true, '用 Google 帳號登入');
    }
    function subscribe(user) {
      if (V.dead) return;
      unsub(subHead); unsub(subItems);
      V.head = null; V.items = []; V.loaded = false;
      message('載入中…', false);
      subHead = fsOnSnapshot(fsDoc(fs, 'shares/' + id), function (snap) {
        if (!snap.exists()) { denied(user); return; }
        V.head = snap.data(); paintHead(); paintItems();
      }, function () { denied(user); });
      subItems = fsOnSnapshot(fsQuery(fsCollection(fs, 'shares/' + id + '/items'), fsLimit(1000)), function (snap) {
        V.items = snap.docs.map(function (d) { return d.data(); }); V.loaded = true; paintItems();
      }, function () { /* the header listener shows the message */ });
    }
    $('shareQ').addEventListener('input', function (e) { V.q = e.target.value; paintItems(); });
    $('shareSignIn').addEventListener('click', function () { signIn(true); });
    $('signOutBtn').addEventListener('click', function () { signOut(auth); });
    window.addEventListener('hashchange', function () { location.reload(); });
    onAuthStateChanged(auth, function (user) {
      if (user) { $('who').textContent = user.email || user.displayName || ''; $('who').hidden = false; $('signOutBtn').hidden = false; registerAccount(fs, user); }
      else { $('who').hidden = true; $('signOutBtn').hidden = true; }
      subscribe(user);
    }, function () { message('目前無法連線，請稍後再試。', false); });
    return function stopViewer() { V.dead = true; unsub(subHead); unsub(subItems); };
  }

  /* ---------- boot (GitHub Pages: Firebase sign-in + Firestore) ---------- */
  function onErr() { state.dbOk = false; render(); }

  /* A thin adapter so the rest of the page keeps the same small API. Everything lives under users/<uid>/. */
  function makeDb(fs, uid) {
    var base = 'users/' + uid + '/';
    function wrapQuery(q) {
      return {
        get: function () { return getDocs(q); },
        onSnapshot: function (next, err) { return fsOnSnapshot(q, next, err); }
      };
    }
    return {
      doc: function (path) {
        var ref = fsDoc(fs, base + path);
        return {
          get: function () { return getDoc(ref).then(function (s) { return { exists: s.exists(), data: function () { return s.data(); } }; }); },
          onSnapshot: function (next, err) {
            return fsOnSnapshot(ref, function (s) { next({ exists: s.exists(), data: function () { return s.data(); } }); }, err);
          },
          set: function (d) { return setDoc(ref, d); },
          update: function (d) { return updateDoc(ref, d); },
          delete: function () { return deleteDoc(ref); }
        };
      },
      collection: function (path) {
        var col = fsCollection(fs, base + path);
        return {
          add: function (d) { return addDoc(col, d); },
          get: function () { return getDocs(col); },
          onSnapshot: function (next, err) { return fsOnSnapshot(col, next, err); },
          limit: function (n) { return wrapQuery(fsQuery(col, fsLimit(n))); },
          orderBy: function (field, dir) {
            return { limit: function (n) { return wrapQuery(fsQuery(col, fsOrderBy(field, dir || 'asc'), fsLimit(n))); } };
          }
        };
      }
    };
  }

  /* the same upload / delete / list surface the page code uses, backed by Firestore documents */
  function makeImageStore() {
    return {
      upload: async function (blob) {
        var data = await blobToDataUrl(blob);
        if (data.length > 700000) { var e = new Error('too large'); e.code = 'too_large'; throw e; }
        var ref = await db.collection('images').add({ data: data, createdAt: Date.now() });
        imageCache.set(ref.id, data);
        return { id: ref.id };
      },
      delete: async function (id) { imageCache.delete(id); await db.doc('images/' + id).delete(); return { deleted: true }; },
      list: async function () { return { usage: null }; }
    };
  }

  function showGate(title, text, withBtn) {
    $('gateTitle').textContent = title; $('gateText').textContent = text;
    $('signInBtn').hidden = !withBtn;
    $('gate').hidden = false; document.body.classList.add('gated');
    $('summary').textContent = '尚未登入';
  }
  function hideGate() { $('gate').hidden = true; document.body.classList.remove('gated'); }
  function configured() { return firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('YOUR_') !== 0; }

  /* back to a clean slate when the account changes or signs out, so nothing from one session lingers */
  function teardown() {
    stopShares();
    unsub(subs.spaces); subs.spaces = null;
    clearCountSubs();
    subs.space.forEach(unsub); subs.space = [];
    closeEditPicker();
    if (linkPicker) { linkPicker.dispose(); $('fImageMount').textContent = ''; linkPicker = null; }
    if (spacePicker) { spacePicker.dispose(); $('sImageMount').textContent = ''; spacePicker = null; }
    $('fImageField').hidden = true; $('sImageField').hidden = true;
    assetsApi = null; imageCache.clear(); imagePending = {}; db = null;
    state.view = 'home'; state.spaceId = null; state.spaces = []; state.spacesLoaded = false;
    state.links = []; state.cats = []; state.loaded = false; state.filter = '__all'; state.q = ''; $('q').value = '';
    state.homeQ = ''; $('homeQ').value = ''; state.editing = null; state.armed = null; state.renamingSpace = null; state.armedSpace = null;
    state.saving = false; state.savingSpace = false; state.creatingSpace = false; state.deletingSpace = null;
    state.canWrite = false; state.dbOk = true;
  }

  function boot() {
    window.__appStarted = true;
    if (!configured()) {
      showGate('還沒有設定 Firebase', '請先把 index.html 上方的 firebaseConfig 換成你自己專案的設定，步驟寫在 README.md。', false);
      return;
    }
    var app = initializeApp(firebaseConfig);
    var auth = getAuth(app);
    var fs = getFirestore(app);

    function signIn(pick) {
      var provider = new GoogleAuthProvider();
      if (pick) provider.setCustomParameters({ prompt: 'select_account' });
      signInWithPopup(auth, provider).catch(function (e) {
        var code = e && e.code;
        if (code === 'auth/popup-blocked') { signInWithRedirect(auth, provider); return; }
        if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return;
        toast(code === 'auth/unauthorized-domain' ? '這個網域還沒加入 Firebase 的授權網域' : '登入失敗，請稍後再試');
      });
    }
    var viewMatch = /^#share=([A-Za-z0-9_-]{16,64})$/.exec(location.hash);
    if (viewMatch) { startViewer(auth, fs, viewMatch[1], signIn); return; }
    if (location.hash === '#join') { startJoin(auth, fs, signIn); return; }
    $('signInBtn').addEventListener('click', function () { signIn(false); });
    $('signOutBtn').addEventListener('click', function () { signOut(auth); });

    onAuthStateChanged(auth, function (user) {
      teardown();
      if (!user) {
        $('who').hidden = true; $('signOutBtn').hidden = true;
        showGate('請先登入', '這個收藏庫是私人的，請用 Google 帳號登入。', true);
        render();
        return;
      }
      hideGate();
      $('who').textContent = user.email || user.displayName || '';
      $('who').hidden = false; $('signOutBtn').hidden = false;
      db = makeDb(fs, user.uid);
      state.canWrite = true; state.dbOk = true;
      assetsApi = makeImageStore();
      linkPicker = makeImagePicker(null); $('fImageMount').appendChild(linkPicker.el); $('fImageField').hidden = false;
      spacePicker = makeImagePicker(null); $('sImageMount').appendChild(spacePicker.el); $('sImageField').hidden = false;
      shareHook = shareApi; startShares(fs, user.uid, user.email);
      listenSpaces();
      render();
    }, onErr);
  }
  render();
  boot();
})();
</script>
</body>
